<!DOCTYPE html>
<html>
<head>
    <title>The VideoStation</title>
    <style>
        body { background-color: #1a1a2e; color: white; font-family: sans-serif; text-align: center; margin: 0; }
        
        /* HOME MENU SCREEN */
        #home-menu { padding: 50px; }
        
        .game-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .game-card {
            background: #16213e;
            border: 3px solid #4ecca3;
            padding: 20px;
            width: 200px;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        .game-card:hover { transform: scale(1.05); background: #1b2a4e; }

        /* PLAYER SCREEN (Hidden by default) */
        #game-player { display: none; padding: 20px; }
        
        #game-screen-box {
            margin: 20px auto;
            width: 485px; 
            height: 402px;
            border: 10px solid #e94560;
            background: black;
        }

        .back-btn { background: #e94560; color: white; padding: 10px 25px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div id="home-menu">
        <h1>THE VIDEOSTATION</h1>
        <div class="game-grid">
            <div class="game-card" onclick="playGame('1267120461', 'Cosmo Fighters')">
                <h2>🚀 Cosmo Fighters</h2>
                <p>Click to Play</p>
            </div>

            <div class="game-card" onclick="playGame('1267149682', 'VS-TV')">
                <h2>📱VS-TV</h2>
                <p>Click to watch!</p>
            </div>

            <div class="game-card" onclick="playGame('ID_HERE', 'New App 2')">
                <h2>🎮 Game 2</h2>
                <p>Coming Soon</p>
            </div>

            <div class="game-card" onclick="playGame('ID_HERE', 'New App 3')">
                <h2>🌟 Game 3</h2>
                <p>Coming Soon</p>
            </div>

            <div class="game-card" onclick="playGame('ID_HERE', 'New App 4')">
                <h2>🛠️ Tool 1</h2>
                <p>Coming Soon</p>
            </div>
        </div>
    </div>

    <div id="game-player">
        <button class="back-btn" onclick="goHome()">⬅ BACK TO MENU</button>
        <h2 id="now-playing">Loading...</h2>
        <div id="game-screen-box">
            <iframe id="main-iframe" src="" width="485" height="402" frameborder="0"></iframe>
        </div>
    </div>

    <script>
        function playGame(id, name) {
            // Only play if you have put an ID in, otherwise it tells you it's coming soon
            if (id === 'ID_HERE') {
                alert("This slot is empty! Add a Scratch ID in your code to play.");
                return;
            }
            
            // Switch screens
            document.getElementById('main-iframe').src = "https://scratch.mit.edu/projects/" + id + "/embed";
            document.getElementById('now-playing').innerText = "Now Playing: " + name;
            document.getElementById('home-menu').style.display = 'none';
            document.getElementById('game-player').style.display = 'block';
        }

        function goHome() {
            // Reset screens
            document.getElementById('main-iframe').src = "";
            document.getElementById('game-player').style.display = 'none';
            document.getElementById('home-menu').style.display = 'block';
        }
    </script>
</body>
</html>
